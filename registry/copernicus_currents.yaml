id: copernicus_currents
label: "Copernicus Marine — Currents (LIVE)"
description: "Live depth-resolved sea water velocity (uo/vo) from Copernicus Marine Service, full India EEZ. Feeds the current-vector arrows and Okubo-Weiss eddy detection. Pre-cached; any other searched region is fetched live, bbox-scoped."

adapter: NetCDFAdapter
source: "http://thredds:8080/thredds/dodsC/netcdf/copernicus_currents.nc"
local_cache: "data/netcdf/copernicus_currents.nc"
# Extent covered by local_cache — a search outside this box fetches live via live_dataset_id.
local_cache_bbox: [58, 2, 100, 26]
live_dataset_id: cmems_mod_glo_phy-cur_anfc_0.083deg_P1D-m
variable: uo
variable_v: vo
standard_name: eastward_sea_water_velocity
long_name: "Eastward Sea Water Velocity"
units: "m s-1"
valid_min: -3.0
valid_max: 3.0

colormap: jet
render_type: vector

default_bbox: [58, 2, 100, 26]
