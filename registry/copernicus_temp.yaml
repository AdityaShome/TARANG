id: copernicus_temp
label: "Copernicus Marine — Temperature (global live-fetch)"
description: "Live 3D sea water potential temperature from Copernicus Marine Service. Pre-cached for the Bay of Bengal; any other searched region is fetched live, bbox-scoped, straight from Copernicus (see live_dataset_id below)."

adapter: NetCDFAdapter
source: "http://thredds:8080/thredds/dodsC/netcdf/copernicus_bob_temp.nc"
local_cache: "data/netcdf/copernicus_bob_temp.nc"
# Extent actually covered by local_cache — a search outside this box skips the stale local
# file and fetches live via live_dataset_id instead of silently returning BoB data.
local_cache_bbox: [58, 2, 100, 26]
# NOT cmems_mod_glo_phy_anfc_0.083deg_P1D-m — that dataset_id only carries surface/derived
# fields (mlotst, zos, sea ice, bottom temp/salinity...). Depth-resolved thetao lives in this
# separate per-variable dataset. Verified directly against the Copernicus Marine API.
live_dataset_id: cmems_mod_glo_phy-thetao_anfc_0.083deg_P1D-m
variable: thetao
standard_name: sea_water_potential_temperature
long_name: "Water Temperature"
units: "degrees_C"
valid_min: -10.0
valid_max: 40.0

colormap: viridis
render_type: volume

default_bbox: [58, 2, 100, 26]
