# TARANG — Nginx Reverse Proxy Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Single origin on port 80 → no CORS issues on demo day.
#
# Routing:
#   /              → React frontend (port 5173 dev / static files prod)
#   /api/          → FastAPI backend (port 8000)
#   /health        → FastAPI health check
#   /thredds/      → THREDDS Data Server (port 8080) — OPeNDAP + WMS + WCS
#   /wms           → THREDDS WMS (ncWMS/Godiva3)
#   /wcs           → THREDDS WCS
#   /opendap/      → THREDDS OPeNDAP (Option A)
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
    }

    upstream thredds {
        server thredds:8080;
    }

    upstream frontend {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name localhost;

        # ── Binary payload support (slice/volume/isosurface responses) ────────
        client_max_body_size 256m;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;

        # ── Frontend (React + Vite) ───────────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            # WebSocket support for Vite HMR
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # ── FastAPI Backend ───────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            # Allow large binary responses (Float32Array volumes)
            proxy_buffering    off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /health {
            proxy_pass http://backend/health;
        }

        # ── THREDDS (OPeNDAP + WMS + WCS + NCSS) ────────────────────────────
        location /thredds/ {
            proxy_pass         http://thredds/thredds/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            # OPeNDAP responses can be large
            proxy_buffering    off;
            proxy_read_timeout 300s;
        }

        # ── OGC WMS shortcut ─────────────────────────────────────────────────
        # /wms/<dataset path>?SERVICE=WMS&... → THREDDS ncWMS. The trailing slash on both
        # the location and the proxy_pass target makes nginx forward the remainder of the
        # URI (the dataset path + query string) unchanged — without it, nginx passed a bare
        # "/thredds/wms/" with no dataset and THREDDS 404'd every request.
        location /wms/ {
            proxy_pass         http://thredds/thredds/wms/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── OGC WCS shortcut ─────────────────────────────────────────────────
        location /wcs/ {
            proxy_pass         http://thredds/thredds/wcs/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── OPeNDAP shortcut ─────────────────────────────────────────────────
        # /opendap/<dataset path> → THREDDS OPeNDAP (dodsC). The clean public form
        # of /thredds/dodsC/… ; the header comment above has always advertised it.
        location /opendap/ {
            proxy_pass         http://thredds/thredds/dodsC/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_buffering    off;
            proxy_read_timeout 300s;
        }

        # ── OGC NCSS (NetCDF Subset Service) shortcut ────────────────────────
        # TDS 5.x serves the grid subset service under /thredds/ncss/grid/<path>.
        location /ncss/ {
            proxy_pass         http://thredds/thredds/ncss/grid/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_read_timeout 300s;
        }
    }
}
